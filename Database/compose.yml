#Data base de PostgreSQL
version: '3.8'
services:
  db:
    image: postgres:latest
    container_name: postgres_db
    environment:
      POSTGRES_USER: ${USUARIO}
      POSTGRES_PASSWORD: ${CONTRASENA}
      POSTGRES_DB: ${NOMBRE_BD}
    ports:
      - "${PUERTO}:5432"
    volumes:
      - db_data:/var/lib/postgresql
volumes:
  db_data:


